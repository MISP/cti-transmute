name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The suite shells out to node for the JS-check tests; without node they
      # skip silently, so install it to keep those checks actually running.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # WeasyPrint (evaluation PDF export) needs native libs to import and
      # render; install them from the shared list so the PDF render tests run
      # here instead of skipping.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(grep -vE '^[[:space:]]*(#|$)' bin/weasyprint-system-deps.txt)
      - name: Sync dependencies
        run: uv sync
      # Scope to tests/ - a bare `pytest` collects vulnerability-lookup and dies.
      - name: Pytest
        run: uv run pytest tests/
