{% extends 'base.html' %}
{# with context so the macros see csp_nonce (a context processor); a plain
   import would render its <script> with an empty nonce and get CSP-blocked #}
{% import 'macros/form_macros.html' as f with context %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-3">Register</h2>

    <div class="" id="main-container">
        {# v-pre: the layout's default Vue app mounts #main-container, so the
           validation errors echoed below would otherwise be compiled. It goes
           on the form and not on #main-container - Vue reads its template from
           the container's innerHTML, so a marker on the container itself is
           inert. Nothing in the form is Vue's; the password toggle is a
           delegated listener on document. #}
        <form v-pre action="" method="post">
            {{ form.hidden_tag() }}
            {% if not edit_mode %}
            {{form.user_id}}
            {%endif%}
            <div class="modal-body">
                <div class="row">
                    <div class="col">
                        {{form.first_name.label(class_="col-form-label")}}: <span style="color:red">*</span>
                        {{form.first_name(class_="form-control")}}
                        {% if form.first_name.errors %}
                        <div style="color: red;">{{form.first_name.errors[0]}}</div>
                        {%endif%}
                    </div>
                    <div class="col">
                        {{form.last_name.label(class_="col-form-label")}}: <span style="color:red">*</span>
                        {{form.last_name(class_="form-control")}}
                        {% if form.last_name.errors %}
                        <div style="color: red;">{{form.last_name.errors[0]}}</div>
                        {%endif%}
                    </div>
                </div>
                <div class="col">
                    {{form.email.label(class_="col-form-label")}}: <span style="color:red">*</span>
                    {{form.email(class_="form-control")}}
                    {% if form.email.errors %}
                    <div style="color: red;">{{form.email.errors[0]}}</div>
                    {%endif%}
                </div>
                <div class="col">
                    <label for="password" class="col-form-label">{{ form.password.label }}</label> <span
                        style="color:red">*</span>
                    <div class="input-group">
                        {{ form.password(class_="form-control pe-5", id="password") }}
                        <span class="input-group-text" style="cursor:pointer;" id="togglePasswordBtn">
                            <i class="fa fa-eye" id="togglePasswordIcon"></i>
                        </span>
                    </div>
                    {% if form.password.errors %}
                    <div style="color: red;">{{ form.password.errors[0] }}</div>
                    {% endif %}
                </div>

                <script nonce="{{ csp_nonce }}">
                    // Delegated: this form is inside #main-container, which the
                    // base layout's default Vue app re-renders after parse, so a
                    // listener attached to the span itself would be dropped.
                    document.addEventListener("click", (e) => {
                        if (!e.target.closest("#togglePasswordBtn")) return;
                        const passwordInput = document.getElementById("password");
                        const icon = document.getElementById("togglePasswordIcon");

                        const isPassword = passwordInput.type === "password";
                        passwordInput.type = isPassword ? "text" : "password";

                        // Change icon
                        icon.classList.toggle("fa-eye");
                        icon.classList.toggle("fa-eye-slash");
                    });
                </script>
                <div class=" text-center" style="margin-top: 10px;">
                    {{form.submit(class='btn btn-primary')}}
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
